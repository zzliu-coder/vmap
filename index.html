 const old=$('user-dot'),circle=$('accuracy-circle');if(state.user){const pos=this.screen(state.user);let dot=old;if(!dot){dot=document.createElement('div');dot.id='user-dot';dot.className='userdot';dot.setAttribute('aria-label','我的位置');$('pins').append(dot);}dot.style.left=pos.x+'px';dot.style.top=pos.y+'px';let ac=circle;if(!ac){ac=document.createElement('div');ac.id='accuracy-circle';ac.className='accuracy';$('accuracy-layer').append(ac);}const mpp=40075016.686*Math.cos(toRadians(state.user.lat))/(256*2**this.zoom),rad=Math.min(5000,state.user.accuracy||0)/mpp;ac.style.width=ac.style.height=(rad*2)+'px';ac.style.left=pos.x+'px';ac.style.top=pos.y+'px';}else{old?.remove();circle?.remove();}

const map=new TravelMap($('map'));
function sourceFooter(){return `<details class="source"><summary>点位、价格来源与隐私说明</summary><p>v3.0.0 · 2026-09-25。目录203家；已上图${MANIFEST.mapped}家。岘港47家均有公开坐标。尚未定位或存在冲突的餐厅保留在列表，不生成假坐标。</p><p>坐标与地址来自 <a href="${MANIFEST.source}" target="_blank" rel="noopener">Jerry Ng / michelin-my-maps</a> 对米其林公开资料的整理，CC BY-NC 4.0。点位为公开记录，非现场测量；实际门牌、营业与分店请出发前核对。个人非商业旅行使用。</p><p>人均为2026旅行参考：标“估算”的价格没有逐家菜单报价；标“官方”的为上一轮核对套餐，税费和饮品另计。预算筛选按区间上限判断。参考汇率：1人民币≈3,871.81越南盾（2026-09-24）。</p><p>手机定位只用于本页画蓝点和计算直线距离，不保存、不上传轨迹。OSM底图服务器会收到你正在浏览区域的地图瓦片请求。点击导航才会打开Google Maps。</p></details>`;}
function listHTML(rows){const pointCount=rows.filter(hasPoint).length;return `<div class="listtitle"><span>${rows.length}家 · ${pointCount}家已上图${state.user?' · 直线距离':''}</span><button id="sort-toggle">${state.sort==='distance'?'按店名排序':'按距离排序'}</button></div>`+(rows.length?rows.map(r=>{const a=awardOf(r);return `<article class="restaurant" data-row="${r.id}"><div class="r-top"><button class="r-name" data-detail="${r.id}">${escapeHTML(r.name)}</button><span class="r-distance">${escapeHTML(distLabel(r))}</span></div><div class="r-meta"><span class="tag ${awardClass(a)}">${escapeHTML(awardLabel(a))}</span><span class="price">${price(r)}/人</span><span class="estimate">${isOfficial(r)?'官方套餐 · 税费前':'预算估算'}</span></div><div class="food">${escapeHTML(r.food)}</div><div class="address">${escapeHTML(r.address||'街道地址待核对；可按店名搜索')}</div>${r.closed?'<div class="warning">⚠ 公开资料标注暂时停业，先联系确认</div>':''}${!hasPoint(r)?`<div class="warning">${escapeHTML(r.positionStatus)}</div>`:''}<div class="rowactions"><button data-detail="${r.id}">${hasPoint(r)?'在地图上看':'查看资料'}</button><a class="nav" target="_blank" rel="noopener" href="${escapeHTML(r.navigationUrl)}">${hasPoint(r)?'导航去这里 ↗':'按地址查路线 ↗'}</a></div></article>`;}).join(''):'<div class="empty">没有符合当前条件的餐厅。放宽预算、切换奖项或清空搜索即可。</div>')+sourceFooter();}
function render(fit=false){const rows=filtered();map.setRows(rows);$('map-count').textContent=CITY[state.city].name+' · '+rows.filter(hasPoint).length+'家餐厅已上图';$('map-hint').textContent='点餐厅看地址';if(!state.selected)$('results').innerHTML=listHTML(rows);document.querySelectorAll('[data-city]').forEach(b=>b.classList.toggle('on',b.dataset.city===state.city));if(fit)map.fit(rows.filter(hasPoint));}
function showDetail(id){const r=DATA.find(x=>x.id===id);if(!r)return;state.selected=id;map.setRows(filtered());if(hasPoint(r))map.view(r,Math.max(map.zoom,15));const a=awardOf(r);$('results').innerHTML=`<div class="detail"><button class="back" id="back-list">← 返回餐厅列表</button><h2>${escapeHTML(r.name)}</h2><div class="r-meta"><span class="tag ${awardClass(a)}">${escapeHTML(awardLabel(a))}</span><span class="r-distance">${escapeHTML(distLabel(r))}</span></div><div class="food">${escapeHTML(r.food)}</div><div class="bigprice">${price(r)} <span>/ 成人每餐</span></div><div class="fine">${escapeHTML(r.priceBasis)} · 参考日期 ${escapeHTML(r.priceDate)}</div><div class="fine">${escapeHTML(r.priceDetail)}。${escapeHTML(r.charges)}</div><div class="address">📍 ${escapeHTML(r.address||'尚未核对街道地址，请按店名搜索确认')}</div>${r.closed?'<div class="banner">公开资料标注暂时停业。请先与餐厅确认，避免白跑。</div>':''}<div class="rowactions"><a class="nav" target="_blank" rel="noopener" href="${escapeHTML(r.navigationUrl)}">打开导航 ↗</a><button id="copy-address">复制地址</button><a target="_blank" rel="noopener" href="${escapeHTML(r.searchUrl)}">地图门店</a></div><div class="years">2025：${escapeHTML(r.awards['2025']||'未在本年度名单')}<br>2026：${escapeHTML(r.awards['2026']||'未在本年度名单')}</div>${r.notes?`<div class="banner">${escapeHTML(r.notes)}</div>`:''}<div class="fine">${escapeHTML(r.positionStatus)}。距离为直线距离，路线长度以导航软件为准。</div>${r.source?`<div class="fine"><a target="_blank" rel="noopener" href="${escapeHTML(r.source)}">查看餐厅来源 ↗</a>${r.menuSource?` · <a target="_blank" rel="noopener" href="${escapeHTML(r.menuSource)}">套餐价格来源 ↗</a>`:''}</div>`:''}<div class="fine">坐标整理：Jerry Ng / michelin-my-maps，CC BY-NC 4.0。</div></div>`;$('results').scrollTop=0;}
function backToList(){state.selected=null;render();}
function setCity(city){state.city=city;state.manualCity=true;state.selected=null;pauseFollowForPan();render(true);$('results').scrollTop=0;}
function status(message,error=false){$('gps-status').textContent=message;$('gps-status').classList.toggle('error',error);}
function pauseFollowForPan(){if(state.following){state.following=false;$('follow').classList.remove('on');status('已暂停地图跟随，定位仍在更新。点击“跟随”重新居中。');}}
function fitNearby(){if(!state.user){startLocation(false);return;}state.selected=null;state.sort='distance';render();const pts=filtered().filter(r=>hasPoint(r)&&!r.closed).slice(0,6);if(pts.length&&distance(state.user,pts[0])<50000)map.fit([state.user,...pts],15);else{map.view(state.user,14);status('定位已显示；当前城市餐厅较远，请切换城市或点“全城餐厅”。');}}
function receivePosition(p,follow,first){const c=p.coords;if(!Number.isFinite(c.latitude)||!Number.isFinite(c.longitude))return;state.user={lat:c.latitude,lon:c.longitude,accuracy:c.accuracy||0};state.sort='distance';if(first&&!state.manualCity){const near=Object.keys(CITY).sort((a,b)=>distance(state.user,CITY[a])-distance(state.user,CITY[b]))[0];if(distance(state.user,CITY[near])<80000)state.city=near;}status('已定位 · 误差约 '+Math.round(state.user.accuracy)+'米 · 按直线距离排序'+(follow?' · 持续更新中':''));$('locate').disabled=false;if(first){fitNearby();}else{if(state.following)map.pan(state.user);render();}map.queue();}
function clearWatch(){state.gpsGeneration++;if(state.watch!==null){navigator.geolocation?.clearWatch(state.watch);state.watch=null;}state.following=false;$('follow').classList.remove('on');$('stop').disabled=true;$('locate').disabled=false;}
function startLocation(follow){if(!window.isSecureContext||location.protocol==='content:'){status('当前打开方式限制定位。请将新版发布到HTTPS网址后，用Chrome打开。餐厅位置和地址仍可直接查看。',true);return;}if(!navigator.geolocation){status('此浏览器不支持定位。餐厅与导航入口可照常使用。',true);return;}clearWatch();const gen=state.gpsGeneration;let first=true;state.following=follow;$('follow').classList.toggle('on',follow);$('stop').disabled=false;$('locate').disabled=true;status('正在获取手机位置，请允许网页定位…');const ok=p=>{if(gen!==state.gpsGeneration)return;receivePosition(p,follow,first);first=false;if(!follow)$('stop').disabled=true;};const fail=e=>{if(gen!==state.gpsGeneration)return;$('locate').disabled=false;const msg={1:'网页位置权限被拒绝：点击Chrome地址栏的网站设置，允许此网站获取位置。',2:'手机暂时无法取得位置。确认系统定位已开启，稍后重试。',3:'定位请求超时，已保留餐厅位置。到信号较好的位置再试。'};status(msg[e.code]||'定位失败，请稍后重试。',true);if(!follow||e.code===1)clearWatch();};const options={enableHighAccuracy:true,timeout:20000,maximumAge:20000};if(follow)state.watch=navigator.geolocation.watchPosition(ok,fail,options);else navigator.geolocation.getCurrentPosition(ok,fail,options);}
document.addEventListener('click',e=>{const city=e.target.closest('[data-city]');if(city){setCity(city.dataset.city);return;}const detail=e.target.closest('[data-detail]');if(detail){showDetail(detail.dataset.detail);return;}if(e.target.closest('#back-list'))backToList();if(e.target.closest('#sort-toggle')){if(!state.user){toast('先点“定位我”获取距离');return;}state.sort=state.sort==='distance'?'name':'distance';render();}if(e.target.closest('#copy-address')){const r=DATA.find(x=>x.id===state.selected);if(!r)return;const s=r.name+'\n'+(r.address||r.cityName);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>toast('地址已复制')).catch(()=>window.prompt('长按复制地址',s));else window.prompt('长按复制地址',s);}});
for(const [id,key]of [['year','year'],['award','award'],['budget','budget']])$(id).addEventListener('change',()=>{state[key]=$(id).value;state.selected=null;render(true);$('results').scrollTop=0;});

$('zoom-in').onclick=()=>map.zoomBy(1);$('zoom-out').onclick=()=>map.zoomBy(-1);$('fit-city').onclick=()=>{pauseFollowForPan();state.selected=null;render(true);};$('nearby').onclick=fitNearby;$('locate').onclick=()=>startLocation(false);$('follow').onclick=()=>startLocation(true);$('stop').onclick=()=>{clearWatch();status('已停止位置更新，蓝点保留最后一次定位。');};$('expand').onclick=()=>{const open=$('sheet').classList.toggle('expanded');$('expand').textContent=open?'收起列表 ↓':'展开列表 ↑';};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state.watch!==null||$('locate').disabled)){clearWatch();status('离开页面后已暂停定位。回来后可点击“定位我”或“跟随”。');}});
