<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#153337" />
    <meta name="robots" content="noindex,nofollow" />
    <title>越南随行地图 · v4.2.0</title>
    <link rel="stylesheet" href="assets/style.css?v=4.2.0" />
    <script type="module" src="assets/app.mjs?v=4.2.0"></script>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div class="titlebar">
          <h1>越南随行地图 <span class="version">v4.2.0</span></h1>
          <div class="header-actions">
            <button id="journal-open">日记</button>
            <button
              id="filter-toggle"
              aria-expanded="false"
              aria-controls="filters"
            >
              筛选</button
            ><button id="clean-map" aria-label="收起面板，放大地图">
              清屏
            </button>
          </div>
        </div>
        <div class="toprow">
          <select id="city" aria-label="选择城市">
            <option value="dn">岘港</option></select
          ><button id="nearby">◎ 看我附近</button
          ><button id="favorites-toggle" aria-pressed="false">♡ 想去</button>
        </div>
        <section id="filters" class="filters" hidden aria-label="搜索与筛选">
          <input
            id="search"
            type="search"
            placeholder="搜地点、菜式或地址…"
            aria-label="搜索地点"
          />
          <div class="filter-grid">
            <label
              >地点类别<select id="category">
                <option value="all">所有类别</option>
              </select></label
            ><label
              >米其林年份<select id="year">
                <option value="2026">2026 榜单</option>
                <option value="2025">2025 榜单</option>
                <option value="all">历年全部</option>
              </select></label
            ><label
              >米其林奖项<select id="award">
                <option value="all">全部 / 含普通地点</option>
                <option value="必比登">必比登</option>
                <option value="入选">入选 / 餐盘</option>
                <option value="一星">一星</option>
              </select></label
            ><label
              >人民币预算上限<select id="budget">
                <option value="all">不限预算</option>
                <option value="50">≤ ¥50</option>
                <option value="100">≤ ¥100</option>
                <option value="300">≤ ¥300</option>
              </select></label
            ><label
              >与我的直线距离<select id="radius">
                <option value="all">不限范围</option>
                <option value="1">1 km 内</option>
                <option value="3">3 km 内</option>
                <option value="5">5 km 内</option>
                <option value="10">10 km 内</option>
                <option value="30">30 km 内</option>
              </select></label
            ><label
              >排列顺序<select id="sort">
                <option value="name">名称</option>
                <option value="distance">离我近优先</option>
              </select></label
            >
          </div>
          <p class="fine">
            年份仅筛选米其林记录；后来添加的景点与普通地点照常显示。预算按区间上限筛选，未知价格只在“不限预算”显示。
          </p>
          <div class="filter-actions">
            <button id="reset-filters">重置筛选</button
            ><button id="manual-location">地图中心作临时位置</button
            ><button id="clear-location">清除我的位置</button>
          </div>
        </section>
      </header>
      <main class="workspace">
        <section
          id="map"
          tabindex="0"
          aria-label="地点地图：可拖动、双指缩放或使用方向键"
        >
          <div id="tiles"></div>
          <div id="accuracy-layer"></div>
          <div id="pins"></div>
          <div class="mapbadge">
            <span id="map-count">正在加载地点…</span
            ><span id="map-hint">点标记看详情</span>
          </div>
          <div class="maptools">
            <button id="zoom-in" aria-label="放大地图">+</button
            ><button id="zoom-out" aria-label="缩小地图">−</button
            ><button id="fit-city" class="small">全部<br />点位</button
            ><button id="restore-panels" class="small" hidden>
              恢复<br />面板
            </button>
          </div>
          <div class="location-dock">
            <div class="gpsbuttons">
              <button class="gps" id="locate">◎ 定位我</button
              ><button id="follow">跟随</button
              ><button id="stop" disabled>停止</button>
            </div>
            <div id="gps-status" class="gpsstatus" role="status">
              地点已上图。定位后可以看离你多远。
            </div>
            <div id="coordinate-panel" class="coordinate-panel" hidden>
              <span id="coordinate-value"></span>
              <div>
                <button id="copy-coordinates">复制经纬度</button>
                <button id="checkin-current">当前位置打卡</button>
              </div>
            </div>
          </div>
          <div id="tile-error" class="tile-error" role="status" hidden>
            底图暂未加载成功，请检查网络。地点列表与 Google Maps 入口仍可使用。
          </div>
          <div id="scale" class="scale"></div>
          <div class="credit">
            ©
            <a
              href="https://www.openstreetmap.org/copyright"
              target="_blank"
              rel="noopener"
              >OpenStreetMap</a
            >
            contributors
          </div>
        </section>
        <section id="sheet" data-mode="collapsed" aria-label="地点列表与详情">
          <div class="sheetbar">
            <button
              id="sheet-toggle"
              aria-expanded="false"
              aria-controls="results"
            >
              <span id="sheet-label">查看地点列表</span
              ><span id="sheet-arrow">↑</span></button
            ><button id="sheet-expand" hidden aria-label="展开更多详情">
              展开</button
            ><button id="sheet-close" hidden aria-label="收起地点面板">
              收起 ↓
            </button>
          </div>
          <div id="results" hidden></div>
        </section>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="copy-dialog">
      <form method="dialog">
        <h2>长按复制</h2>
        <p id="copy-label"></p>
        <textarea
          id="copy-value"
          readonly
          aria-label="需要复制的文本"
        ></textarea
        ><button value="close">完成</button>
      </form>
    </dialog>
    <dialog id="checkin-dialog">
      <form id="checkin-form">
        <h2 id="checkin-heading">地点打卡</h2>
        <label
          >地点名称<input id="checkin-title" required maxlength="120"
        /></label>
        <label
          >时间<input id="checkin-time" type="datetime-local" required
        /></label>
        <p id="checkin-location" class="fine"></p>
        <label
          >备注<textarea
            id="checkin-note"
            rows="5"
            maxlength="4000"
            placeholder="今天吃了什么、发生了什么、值不值得再来……"
          ></textarea>
        </label>
        <label
          >照片<input id="checkin-photos" type="file" accept="image/*" multiple
        /></label>
        <div id="checkin-preview" class="checkin-preview"></div>
        <p class="fine">
          最多保存 8 张；大图会压缩。照片和备注只存在这台设备的浏览器里。
        </p>
        <div class="dialog-actions">
          <button type="button" id="checkin-cancel">取消</button
          ><button class="primary" type="submit" id="checkin-save">
            保存打卡
          </button>
        </div>
      </form>
    </dialog>
    <dialog id="journal-dialog">
      <div class="journal-head">
        <div>
          <h2>旅行日记</h2>
          <p id="journal-summary" class="fine"></p>
        </div>
        <button id="journal-close">关闭</button>
      </div>
      <div class="journal-actions">
        <button id="journal-new">当前位置打卡</button
        ><button id="journal-export-html">导出日记 HTML</button
        ><button id="journal-export-backup">备份 JSON</button
        ><button id="journal-import">导入备份</button
        ><input
          id="journal-import-file"
          type="file"
          accept="application/json,.json"
          hidden
        />
      </div>
      <div id="journal-list"></div>
      <p class="journal-warning">
        打卡资料保存在当前浏览器本地。清除网站数据、卸载浏览器或换手机可能丢失，请定期导出备份。
      </p>
    </dialog>
    <noscript
      ><p>
        此地图需要启用 JavaScript。也可直接在 Google Maps 按地点名称查询。
      </p></noscript
    >
  </body>
</html>
